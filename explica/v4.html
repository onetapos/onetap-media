<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>

  .scr.dark .bq { background:#1f2422; color:#e8e8e5; border-radius: 16px; padding: 14px 16px; font-size: 19px; line-height: 1.32; margin-bottom: 12px; display:flex; gap: 12px; }

</style></head><body><div id="stage">

<script>
const P=new URLSearchParams(location.search); const D=JSON.parse(decodeURIComponent(P.get('d')));
const ES=D.lang==='es'; const L=(a,b)=>ES?a:b;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3); const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function fadeWin(t,a,b,fi=.3,fo=.3){ return Math.min(eo(lin(t,a,a+fi)), 1-lin(t,b-fo,b)); }
// ---------- big words
const BIG=[];
D.beats.filter(b=>b.type==='big').forEach(b=>{ const el=document.createElement('div'); el.className='bigx'+(b.cls?' '+b.cls:''); if(b.top) el.style.top=b.top+'px';
  el.innerHTML=b.w.map(w=>`<span class="w">${w}</span>`).join(' '); $('bigs').appendChild(el); BIG.push([b,[...el.querySelectorAll('.w')]]); });
// ---------- screens
const bar=`<div class="appbar"><div class="logo"></div><span>OneTap</span></div>`;
const SCR={
 import:()=>({h:L('Importar negocio','Import your business'), s:L('Sube un PDF o una foto','Upload a PDF or a photo'), html:
   `<div class="paper"><div class="t">${L('LISTA DE PRECIOS','PRICE LIST')}</div>`+
   [[L('Café americano','Americano'),'2.50'],[L('Capuchino','Cappuccino'),'3.25'],['Croissant','3.00'],[L('Sándwich de pavo','Turkey sandwich'),'6.00'],[L('Jugo natural','Fresh juice'),'3.50']].map(([n,p])=>`<div class="it"><span>${n}</span><span>$${p}</span></div>`).join('')+`<div class="scan"></div></div>`+
   `<div class="pill2 ai"><b>✓</b>${L('5 productos creados','5 products created')}</div><div class="pill2 ai"><b>✓</b>${L('Precios y categorías listos','Prices and categories ready')}</div><div class="pill2 ai"><b>✓</b>${L('Inventario inicial armado','Starting inventory set up')}</div>`}),
 invoice:()=>({h:L('Factura del proveedor','Supplier invoice'), s:L('Foto · leída con IA','Photo · read by AI'), html:
   `<div class="inv"><div class="row" style="font-weight:800;color:#131615"><span>${L('Distribuidora Central','Central Supply Co.')}</span><span>#4821</span></div>`+
   [[L('Café en grano · 5 lb','Coffee beans · 5 lb'),'42.00'],[L('Leche · 12 L','Milk · 12 L'),'18.00'],[L('Harina · 25 lb','Flour · 25 lb'),'21.50']].map(([n,p])=>`<div class="row ai"><span>${n}</span><span>$${p}</span></div>`).join('')+`<div class="row" style="border:0;font-weight:800;color:#131615"><span>Total</span><span>$81.50</span></div></div>`+
   `<div class="chg ai"><span>${L('Inventario','Stock')}</span><b>${L('Actualizado ✓','Updated ✓')}</b></div><div class="chg ai"><span>${L('Costos','Costs')}</span><b>${L('Actualizados ✓','Updated ✓')}</b></div><div class="chg ai"><span>${L('Por pagar','Payable')}</span><b>${L('30 días','Net 30')}</b></div>`}),

   [[L('Café americano','Americano'),'2.50','0.62','75%'],[L('Capuchino','Cappuccino'),'3.25','0.92','72%'],['Croissant','3.00','1.10','63%'],[L('Sándwich de pavo','Turkey sandwich'),'6.00','2.40','60%']].map(([n,p,c,m],i)=>
   `<div class="dish ai${i==0?' hl':''}"><div class="n">${n}</div><div class="g"><div>${L('Precio','Price')}<b>$${p}</b></div><div>${L('Costo','Cost')}<b>$${c}</b></div><div class="mg">${L('Margen','Margin')}<b>${m}</b></div></div></div>`).join('')}),
 brief:()=>({dark:true, h:L('Tu día de hoy','Your day today'), s:L('7:00 a. m. · 3 acciones','7:00 a.m. · 3 actions'), html:
   [[L('Pide café en grano hoy','Order coffee beans today'),L('Llega al mínimo el jueves','You hit the minimum Thursday')],[L('Revisa el precio del croissant','Review the croissant price'),L('Su costo subió esta semana','Its cost went up this week')],[L('Refuerza el turno del sábado','Add help on Saturday'),L('Es tu día de más ventas','Your busiest day')]].map(([a,b],i)=>`<div class="bq ai"><i>${i+1}</i><div>${a}<small>${b}</small></div></div>`).join('')}),
 hours:()=>({h:L('Configuración','Setup'), s:L('El tiempo depende de tus documentos','Timing depends on your documents'), html:
   [[L('Productos importados','Products imported')],[L('Precios y categorías','Prices and categories')],[L('Inventario inicial','Starting inventory')],[L('Equipo y roles','Team and roles')]].map(([n])=>`<div class="card ai"><div><b>${n}</b></div><div class="v mg">✓</div></div>`).join('')+`<div class="card tot ai"><div><b>${L('Listo para vender','Ready to sell')}</b></div><div class="v">●</div></div>`}),
 support:()=>({h:L('Empieza tú mismo','Get started'), s:L('A tu ritmo','At your own pace'), html:
   `<div class="note ok ai">✓ ${L('Sin reuniones de implementación','No implementation meetings')}</div><div class="note ok ai">✓ ${L('Sin equipo de implementación','No implementation team required')}</div><div class="note gold ai">${L('Soporte por WhatsApp cuando lo necesites','Support on WhatsApp when you need it')}</div><div class="btnx ai" style="margin-top:16px">${L('Empezar ahora','Start now')}</div>`}),
 connected:()=>({dark:true, h:L('Tu negocio','Your business'), s:L('Todo en un solo lugar','All in one place'), html:
   [[L('Ventas','Sales'),L('En tiempo real','Real time')],[L('Inventario','Inventory'),L('Se descuenta solo','Updates itself')],[L('Costos','Costs'),L('Por producto','By product')],[L('Tu equipo','Your team'),L('Turnos y planilla','Shifts and payroll')],[L('Finanzas','Finances'),L('Flujo de caja','Cash flow')]].map(([n,d])=>`<div class="card ai"><div><b>${n}</b><span class="s">${d}</span></div><div class="v"><span class="ok">●</span></div></div>`).join('')+`<div class="card tot ai"><div><b>OneTap</b></div><div class="v">${L('Conectado','Connected')}</div></div>`}),
 chat:()=>({h:L('Tu asistente','Your assistant'), s:L('Responde con tus cifras reales','Answers with your real numbers'), html:
   `<div class="wa" style="background:#e9e4d8"><div class="bub out ai">${L('¿Cuánto me dejó el café esta semana?','How much did coffee make me this week?')}</div>`+
   `<div class="bub in ai">${L('Vendiste 214 cafés americanos. Te dejaron <b>$402</b> de margen.','You sold 214 Americanos. They left you <b>$402</b> in margin.')}</div></div>`+
   `<div class="auto ai"><div class="t">${L('Nivel de autonomía de la IA','AI autonomy level')}</div><div class="row"><span class="on">${L('Recomendar','Suggest')}</span><span>${L('Preparar','Draft')}</span><span>${L('Aprobar','Approve')}</span><span>${L('Actuar','Act')}</span></div></div>`+
   `<div class="note gold ai" style="margin-top:12px">${L('Tú decides hasta dónde llega','You decide how far it goes')}</div>`}),
};
const FC={hours:[L('Sin semanas','No weeks'),L('Empiezas en horas','Start in hours')], support:[L('Soporte','Support'),L('Cuando lo necesites','When you need it')], connected:[L('Conectado','Connected'),L('Todo tu negocio','Your whole business')], import:[L('PDF o foto','PDF or photo'),L('Sin semanas de implementación','No weeks of setup')], invoice:[L('Facturas','Invoices'),L('Inventario y costos al día','Stock and costs up to date')],
  margin:[L('Margen','Margins'),L('En cada producto','On every product')], brief:[L('Cada mañana','Every morning'),L('3 acciones para tu dinero','3 actions for your money')], chat:[L('Tú decides','You decide'),L('4 niveles de autonomía','4 levels of autonomy')]};
const UI=D.beats.find(b=>b.type==='ui'); const ST=UI?UI.steps:[]; const NST=ST.length;
const scrEls=[], hEls=[], fcEls=[];
ST.forEach((s,i)=>{ const c=SCR[s.scr](); const e=document.createElement('div'); e.className='scr'+(c.dark?' dark':''); e.innerHTML=bar+`<h4>${c.h}</h4><div class="sub">${c.s}</div>`+c.html; $('screen2').appendChild(e); scrEls.push([e,[...e.querySelectorAll('.ai')]]);
  const h=document.createElement('div'); h.className='stepH'; h.innerHTML=(UI.nonum?'':`<span class="num">${i+1}.</span> `)+s.h; $('stepHs').appendChild(h); hEls.push(h);
  const f=document.createElement('div'); f.className='fc2'; const fp=[[40,1180],[40,760],[40,1180],[40,760],[40,1180]][i%5]; f.style.left=fp[0]+'px'; f.style.top=fp[1]+'px'; f.innerHTML=`<small>${FC[s.scr][0]}</small>${FC[s.scr][1]}`; $('fcs').appendChild(f); fcEls.push(f); });
$('uiIllus2').textContent=L('Ejemplo ilustrativo','Illustrative example');
$('endCta').innerHTML=`<div class="l1">${D.endl}</div><div class="btn">${L('Primer mes gratis','First month free')}</div><div style="margin-top:28px;font-size:34px;color:#9A9B98">${L('Sin tarjeta · onetaphq.com','No card required · onetaphq.com')}</div>`;
let ph=''; for (let i=0;i<40;i++){ ph+=`<div class="pt" id="pt${i}"></div>`; } $('pts').innerHTML=ph;
// subs
const chunks=[]; (D.segs||[]).forEach(([a,b,txt])=>{ const ws=txt.split(' '); const tot=ws.reduce((s,w)=>s+w.length+1,0); let t=a; const per=(b-a)/tot;
  const wt=ws.map(w=>{const s=t; t+=(w.length+1)*per; return [w,s,t];}); for(let i=0;i<wt.length;i+=4){ const g=wt.slice(i,i+4); if(i+4<wt.length && wt.length-(i+4)===1){g.push(wt[i+4]); i++;} chunks.push(g);} });
const BAT=D.beats.find(b=>b.type==='batt'); const FL=D.beats.filter(b=>b.type==='flash');
function battAt(t){ const k=BAT.k; if(t<=k[0][0]) return k[0][1]; for(let i=1;i<k.length;i++){ if(t<=k[i][0]){ const [t0,v0]=k[i-1],[t1,v1]=k[i]; return v0+(v1-v0)*eo(lin(t,t0,t1)); } } return k[k.length-1][1]; }
window.seek=function(t){
  const end=t>=D.end; const inUI=UI && t>=UI.a && t<UI.b;
  let anyBig=0;
  BIG.forEach(([b,ws])=>{ const out=b.b; const st=b.step||0.11; ws.forEach((w,i)=>{ let s=b.a+i*st; if(b.at) s=b.at[i]; const k=back(lin(t,s,s+.35)); w.style.opacity=clamp(lin(t,s,s+.2))*(1-lin(t,out-.25,out)); w.style.transform=`translateY(${(1-k)*60}px) scale(${.85+.15*k})`; }); if(t>=b.a&&t<b.b) anyBig=1; });
  $('hookShade').style.opacity = (end||inUI)?0:(anyBig?1:0.35);
  $('botShade').style.opacity = (end||inUI)?0:1;
  // flash
  let fl=0; FL.forEach(f=>{ fl=Math.max(fl, Math.min(eo(lin(t,f.a-.12,f.a)), 1-lin(t,f.a,f.a+.5))); }); $('flash').style.opacity=fl*0.85;
  // battery
  if(BAT){ $('batt').style.opacity=Math.max(...BAT.win.map(([a,b])=>fadeWin(t,a,b,.3,.3))); { const v=battAt(t); const charging=BAT.charge && t>=BAT.charge[0] && t<BAT.charge[1]+0.6;
    $('lvl').style.width=Math.max(2,v)+'%'; $('pct').textContent=Math.round(v)+'%';
    $('lvl').style.background = charging? '#D4AF37' : (v>55?'#3fbf7f':(v>25?'#e0a32e':'#e5484d'));
    const blink = (!charging && v<12)? (0.35+0.65*Math.abs(Math.sin(t*7))) : 1; $('lvl').style.opacity=blink;
    $('bolt').style.opacity = charging? (0.6+0.4*Math.sin(t*10)) : 0;
    $('batt').style.transform=`scale(${1+(charging?0.06*Math.sin(t*8):0)})`; $('batt').style.transformOrigin='left center'; } }
  // UI
  if(UI){ $('ui2').style.opacity = inUI? Math.min(eo(lin(t,UI.a,UI.a+.3)), 1-lin(t,UI.b-.2,UI.b)) : 0;
    if(inUI){ const lt=t-UI.a; const ent=eo(lin(lt,0,.7)); const ry=-14+9*Math.sin(lt*0.45), rx=5-3*Math.cos(lt*0.5);
      $('phone2').style.transform=`translateY(${(1-ent)*500+Math.sin(lt*1.1)*8}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${.96+.04*ent})`;
      let cur=0; ST.forEach((s,i)=>{ if(t>=s.t) cur=i; });
      $('stepK').style.opacity=eo(lin(lt,.1,.4)); $('stepK').innerHTML=`${L('ASÍ FUNCIONA','HOW IT WORKS')}<span class="dots">${ST.map((s,i)=>`<i class="${i<=cur?'on':''}"></i>`).join('')}</span>`;
      ST.forEach((s,i)=>{ const a=s.t, b=(i+1<NST? ST[i+1].t : UI.b);
        const h=hEls[i]; const ho = Math.min(eo(lin(t,a-.05,a+.3)), i+1<NST? 1-lin(t,b-.25,b) : 1); h.style.opacity=ho; h.style.transform=`translateY(${(1-eo(lin(t,a-.05,a+.4)))*40}px)`;
        const [e,items]=scrEls[i]; const o = Math.min(i==0?1:eo(lin(t,a-.2,a+.15)), i+1<NST? 1-lin(t,b-.1,b+.2):1); e.style.opacity=o; e.style.clipPath = i==0?'none':`circle(${eo(lin(t,a-.2,a+.35))*150}% at 80% 10%)`;
        const d=b-a; const step=Math.min(0.32,(d-0.9)/Math.max(1,items.length));
        items.forEach((x,j)=>{ const s0=a+(s.scr=='import'?1.25:0.35)+j*step; x.style.opacity=eo(lin(t,s0,s0+.22)); x.style.transform=`translateY(${(1-back(lin(t,s0,s0+.4)))*36}px)`; });
        if(s.scr=='import'){ const sc=e.querySelector('.scan'); const k=lin(t,a+.15,a+1.25); sc.style.opacity=(k>0&&k<1)?1:0; sc.style.top=(k*100)+'%'; }
        const f=fcEls[i]; f.style.opacity=Math.min(eo(lin(t,a+.5,a+.8)),1-lin(t,b-.2,b+.1)); f.style.transform=`translateY(${Math.sin(t*1.4+i)*10}px) scale(${.8+.2*back(lin(t,a+.5,a+.9))})`; });
    } }
  // end
  $('end').style.opacity = end ? eo(lin(t,D.end,D.end+.3)) : 0;
  if (end) { const lt=t-D.end;
    $('lgRing').setAttribute('stroke-dashoffset', 352*(1-eo(lin(lt,.15,.9)))); $('lgDot').style.transform=`scale(${back(lin(lt,.8,1.1))})`; $('lgDot').style.transformOrigin='182px 48px';
